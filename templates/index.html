<!DOCTYPE html>
<html>
<head>
    <title>Add Certificate</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <h2>Add Certificate</h2>
    <form action="/add_certificate" method="POST" enctype="multipart/form-data" class="mb-3">
        <input class="form-control mb-2" type="text" name="student" placeholder="Student Name" required>
        <input class="form-control mb-2" type="text" name="degree" placeholder="Degree" required>
        <input class="form-control mb-2" type="number" name="year" placeholder="Year" required>
        <input class="form-control mb-2" type="file" name="file" required>
        <button class="btn btn-success" type="submit">Add Certificate</button>
    </form>

    <div class="mb-3">
       
        <a class="btn btn-info me-2" href="/chain">View Blockchain</a>
        <a class="btn btn-warning" href="/logout">Logout</a>
    </div>

    <h3>Verify Certificate</h3>
    <form method="POST" action="/verify" enctype="multipart/form-data" class="mb-3">
        <input class="form-control mb-2" type="file" name="file" required>
        <button class="btn btn-dark" type="submit">Verify</button>
    </form>
    {% if result %}
    <div class="alert alert-info">{{ result }}</div>
    {% endif %}
</div>
</body>
</html>
